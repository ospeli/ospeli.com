<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<title>Ospeli app · Example General Hospital</title>
<meta name="description" content="Ospeli healthcare operations app. Offline-first. Fictional hospital, synthetic data only.">
<meta name="theme-color" content="#0B2F4E">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../brand/icons/ospeli_app_180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/nunito-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/nunito-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <!-- Navigation v2: the department chip, then the date and time, then search. -->
  <button class="dept-chip" id="dept-btn" type="button" aria-haspopup="dialog" data-test="dept-chip"><span id="dept-name">Department</span><span class="dept-caret" aria-hidden="true">▾</span></button>
  <span class="top-time" id="top-time" data-test="top-time"></span>
  <a class="top-search" id="top-search" href="#/journey/search" data-test="top-search">Search</a>
  <div class="hospital">
    <span class="hospital-name">Example General Hospital</span>
    <span class="badge" id="synthetic-badge" data-test="synthetic-badge">Checking data…</span>
    <!-- Issue #37: short messages show over this row of the top bar, which holds no control, so they never cover one. -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>
</header>
<div class="layout">
  <main id="main" tabindex="-1">
    <noscript><p class="card">The Ospeli app needs JavaScript. The product site is at <a href="../index.html">ospeli.com</a>.</p></noscript>
    <p class="loading">Loading…</p>
  </main>
  <!-- The dock: five places, words always shown. A left rail on wide screens. -->
  <nav id="dock" class="dock" aria-label="Main">
    <a href="#/home" data-dock="home"><span class="dock-word">Now</span></a>
    <a href="#/journey" data-dock="journey"><span class="dock-word">Journey</span></a>
    <a href="#/process/walk" data-dock="walk" class="dock-walk"><img src="../brand/ospeli_symbol_dark.svg" alt="" width="34" height="34"><span class="dock-word">Walk</span></a>
    <a href="#/process" data-dock="maps"><span class="dock-word">Maps</span></a>
    <a href="#/me" data-dock="me"><span class="dock-word">Me</span></a>
  </nav>
</div>
<dialog id="dept-sheet" class="sheet" aria-labelledby="dept-h" data-test="dept-sheet">
  <h2 id="dept-h">Where do you work?</h2>
  <p class="meta" id="dept-why">Ospeli shows your department's pages and words first. You can change this at any time at the top of the screen.</p>
  <div id="dept-list" class="dept-list"></div>
  <p class="meta">These departments are an example setting, not a standard.</p>
</dialog>
<script type="module" src="app.js"></script>
</body>
</html>
