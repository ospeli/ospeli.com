name: Test and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"   # nightly, 06:17 UTC
  workflow_dispatch:

# Least access: the test job only reads the code. Only the deploy job may publish the site,
# so a test tool downloaded during the check can never publish anything.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check pages, links, offline cache and synthetic-data rule
        run: python scripts/check.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests
        run: npm test
      - name: Install Playwright (tests only; the site has no build step)
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e

  # The site is packed in its own job, before the publish job starts. Since 23 Nov 2026 the publish
  # step, run in the same job a fraction of a second after the upload, was told "No artifacts named
  # github-pages were found" on every run (ospeli/ospeli backlog note, 25 Nov; the same fault is
  # reported at actions/deploy-pages#451). A separate job gives the upload time to be listed.
  package:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.second.outputs.page_url || steps.third.outputs.page_url }}
    steps:
      # Only the publish step is tried again (after 30 s, then 60 s). The upload is never repeated:
      # two "github-pages" uploads in one run make every later publish fail.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: second
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure' && steps.second.outcome == 'failure'
        run: sleep 60
      - id: third
        if: steps.deployment.outcome == 'failure' && steps.second.outcome == 'failure'
        uses: actions/deploy-pages@v5
